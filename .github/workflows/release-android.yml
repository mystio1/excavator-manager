name: Release Android APK

# Triggered by pushing a version tag, e.g.:
#   git tag -a v1.0.3 -m "Dashboard improvements" -m "Bug fixes"
#   git push origin v1.0.3
#
# Each line of the tag's annotated message becomes one release-notes bullet
# in version.json. To ship a mandatory update, add a line containing
# exactly "[force-update]" anywhere in the message — it's stripped from the
# notes shown to users and just flips forceUpdate to true.
#
# Can also be re-run manually from the Actions tab (workflow_dispatch) —
# pick the tag to build from via "Use workflow from".
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # need full history to read the tag's annotated message

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build static-exported web bundle
        run: npm run build:android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Derive version + release notes from the tag
        id: ver
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

          # actions/checkout resolves tag-triggered runs by commit SHA, not
          # by the tag object itself, so the local tag ref it leaves behind
          # can be a lightweight ref pointing straight at the commit — which
          # makes `%(contents)` read the COMMIT message instead of the
          # annotated tag's own message. Force-fetch the real tag object by
          # name first so this always reads what was actually typed in
          # `git tag -a -m "..."`.
          git fetch origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force

          TAG_MESSAGE="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"

          if echo "$TAG_MESSAGE" | grep -qF '[force-update]'; then
            echo "forceUpdate=true" >> "$GITHUB_OUTPUT"
          else
            echo "forceUpdate=false" >> "$GITHUB_OUTPUT"
          fi

          NOTES_JSON=$(echo "$TAG_MESSAGE" \
            | grep -vF '[force-update]' \
            | sed '/^\s*$/d' \
            | node -e 'const lines=require("fs").readFileSync(0,"utf-8").split("\n").filter(Boolean);console.log(JSON.stringify(lines.length?lines:["Bug fixes and improvements."]))')
          echo "notesJson<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES_JSON" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Values derived from the tag name go through the environment and are quoted: a tag name is
          # attacker-influenced text (a ref may contain $, backticks and parentheses) and must never be
          # pasted into a shell script by the expression engine.
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Compute APK checksum + write version.json
        id: meta
        env:
          # Through the environment, never pasted into the script: the release notes come from the
          # annotated tag message, which an unquoted heredoc would have executed ($(...), backticks).
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
          FORCE_UPDATE: ${{ steps.ver.outputs.forceUpdate }}
          NOTES_JSON: ${{ steps.ver.outputs.notesJson }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          APK_SHA256="$SHA256" node -e '
            const e = process.env;
            const version = {
              versionCode: Number(e.VERSION_CODE),
              versionName: e.VERSION_NAME,
              apkUrl: "https://github.com/" + e.REPOSITORY + "/releases/download/" + encodeURIComponent(e.TAG_NAME) + "/app-release.apk",
              apkSha256: e.APK_SHA256,
              forceUpdate: e.FORCE_UPDATE === "true",
              releaseNotes: JSON.parse(e.NOTES_JSON),
            };
            require("fs").writeFileSync("version.json", JSON.stringify(version, null, 2) + "\n");
          '
          cp "$APK_PATH" app-release.apk

      - name: Software bill of materials (production dependencies)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: Publish GitHub Release
        run: |
          gh release create "$TAG_NAME" \
            app-release.apk version.json sbom.cdx.json \
            --title "$VERSION_NAME" \
            --notes "Automated release build. See version.json for structured release notes."
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
